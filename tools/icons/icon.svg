<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5fa8" />
      <stop offset="1" stop-color="#10233f" />
    </linearGradient>
    <radialGradient id="marble" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#e4f3ff" />
      <stop offset="0.35" stop-color="#7fc0ff" />
      <stop offset="1" stop-color="#1450a8" />
    </radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b955" />
      <stop offset="1" stop-color="#e2861a" />
    </linearGradient>
  </defs>
  <!-- Full-bleed background so a maskable crop works; the art stays inside the safe circle. -->
  <rect width="512" height="512" fill="url(#bg)" />
  <g id="art">
    <!-- U-shaped channel, seen end-on as it curves away -->
    <path d="M104 300 C 150 420 362 420 408 300" fill="none" stroke="url(#track)" stroke-width="44"
      stroke-linecap="round" />
    <path d="M104 300 C 150 420 362 420 408 300" fill="none" stroke="#ffffff" stroke-opacity="0.35"
      stroke-width="8" stroke-linecap="round" transform="translate(0 -14)" />
    <!-- Glass marble -->
    <circle cx="256" cy="262" r="112" fill="url(#marble)" />
    <path d="M190 268 C 220 220 290 300 322 246" fill="none" stroke="#f2a72b" stroke-width="16"
      stroke-linecap="round" opacity="0.85" />
    <ellipse cx="218" cy="210" rx="34" ry="22" fill="#ffffff" opacity="0.7" transform="rotate(-30 218 210)" />
  </g>
</svg>
